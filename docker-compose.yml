version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: garnacheros-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=garnacheros
      - POSTGRES_PASSWORD=garnacheros_dev_password
      - POSTGRES_DB=garnacheros
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garnacheros"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - garnacheros-network
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: garnacheros-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://garnacheros:garnacheros_dev_password@db:5432/garnacheros
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - PORT=3001
      - FRONTEND_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/dist:/app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - garnacheros-network

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: garnacheros-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost/api
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: nginx:alpine
    container_name: garnacheros-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  garnacheros-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
